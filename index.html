<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensure perfect high-density mobile layout scaling and eliminate standard elastic scrolling behaviour -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>YOUR YACHT. FULLY MANAGED. — OBSIDIAN Yachts Management L.L.C</title>
  
  <!-- Premium SEO Architecture -->
  <meta name="description" content="End-to-end premium yacht management services in Dubai. Designed for luxury yacht owners who demand ultimate reliability, absolute discretion, and total control.">
  <meta name="keywords" content="Obsidian Yachts, Yacht Management Dubai, Luxury Yacht Management, Yacht Charter Management Dubai, Superyacht Maintenance Dubai">
  <meta name="author" content="Nextweb">
  
  <!-- Open Graph Protocol for high-end preview sharing -->
  <meta property="og:title" content="OBSIDIAN Yachts Management L.L.C — Dubai">
  <meta property="og:description" content="End-to-end premium yacht management services in Dubai. High-fidelity management for owners who expect reliability, discretion, and control.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://obsidianyachts.com">
  <meta property="og:image" content="logo_white.png">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OBSIDIAN Yachts Management L.L.C — Dubai">
  <meta name="twitter:description" content="End-to-end premium yacht management services in Dubai for owners who expect reliability, discretion, and control.">
  <meta name="twitter:image" content="logo_white.png">

  <!-- Favicon System Configuration -->
  <link rel="icon" type="image/png" href="logo_white.png">
  
  <!-- Link Vanilla Stylesheet -->
  <link rel="stylesheet" href="index.css">
  <!-- Link Kinetic Typography & Interactive Layer Engine (V6) -->
  <script src="app.js" defer></script>
</head>
<body>

  <!-- LAYER 1: Fullscreen Media Loop Engine -->
  <div class="video-background-container">
    <video id="obsidian-video-bg" autoplay muted loop playsinline preload="auto">
      <source src="obsidian_loop.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- LAYER 2: Translucent Contrast Vignette (THE SHIELD) -->
  <div class="contrast-shield"></div>
  <div class="cinematic-vignette"></div>

  <!-- LAYER 3: Foreground Interactive Layout Framework -->
  <div class="foreground-layout">
    
    <!-- Top Nav / Headers -->
    <header class="header-container">
      <!-- Brand Asset (Logotype logo_white.png centered top: 60px) -->
      <div class="brand-logo-container" id="brand-logo">
        <a href="#" aria-label="OBSIDIAN Yachts Management Home">
          <img src="logo_white.png" alt="OBSIDIAN Yachts Management L.L.C" id="obsidian-logo-img">
        </a>
      </div>
    </header>

    <!-- Root-level desktop contact email link -->
    <a href="mailto:office@obsidian.com" class="email-contact-link desktop-only-email" aria-label="Email Obsidian Yachts Management">office@obsidian.com</a>

    <!-- Center Left Terminal Focus Content (id="kinetic-container") -->
    <main class="content-terminal text-terminal" id="kinetic-container">

      <!-- Dynamic blurred contrast shadow overlay wrapper -->
      <div class="layer shadow-layer" data-depth="0.04">
        <div class="shadow-overlay-glow"></div>
      </div>
      
      <!-- LAYER 1: title-line-1 (data-depth="0.05") -->
      <div class="layer" data-depth="0.05">
        <h1 class="title-line-1">YOUR YACHT.</h1>
      </div>
      
      <!-- LAYER 2: title-line-2 (data-depth="0.07") -->
      <div class="layer" data-depth="0.07">
        <h1 class="title-line-2">FULLY MANAGED.</h1>
      </div>
      
      <!-- LAYER 3: description (data-depth="0.03") -->
      <div class="layer" data-depth="0.03">
        <p class="description" id="terminal-desc">
          End-to-end yacht management services in Dubai for owners who expect reliability, discretion, and control.
        </p>
      </div>
      
      <!-- LAYER 4: cta (data-depth="0.02") -->
      <div class="layer" data-depth="0.02">
        <button class="cta" id="cta-action" aria-label="Get in touch with Obsidian Yachts Management" onclick="window.location.href='mailto:info@obsidianyachts.com?subject=Obsidian%20Yachts%20Inquiry'">
          GET IN TOUCH
        </button>
      </div>

      <!-- LAYER 5: Mobile-only email link (data-depth="0.01") -->
      <div class="layer mobile-only-email" data-depth="0.01">
        <a href="mailto:office@obsidian.com" class="email-contact-link" aria-label="Email Obsidian Yachts Management">office@obsidian.com</a>
      </div>
      
    </main>

    <!-- Bottom Footer Layout Grid -->
    <footer class="footer-container">
      <a href="https://nextweb.ua/" class="footer-item footer-right nextweb-credit" id="footer-credits" target="_blank" rel="noopener noreferrer" aria-label="Created by Nextweb Website Link">
        Created by Nextweb
      </a>
    </footer>

  </div>
</body>
</html>
